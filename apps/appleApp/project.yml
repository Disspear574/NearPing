name: NearPing
options:
  bundleIdPrefix: com.disspear574
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "20"
packages:
  NearPingKit:
    path: NearPingKit
targets:
  NearPing:
    type: application
    platform: macOS
    # Signing lives in config/Signing.xcconfig, which git ignores.
    configFiles:
      Debug: ../../config/Signing.xcconfig
      Release: ../../config/Signing.xcconfig
    # The target is an entry point: @main, Info.plist, assets, strings and sounds; code is in NearPingKit.
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: NearPing
        CFBundleDisplayName: NearPing
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "NearPing finds your colleagues' Macs on this network so you can call them."
        NSBonjourServices:
          - _nearping._tcp
        ITSAppUsesNonExemptEncryption: true
    dependencies:
      - package: NearPingKit
        product: NearPingPlatform
      - package: NearPingKit
        product: NearPingUI
    settings:
      base:
        PRODUCT_NAME: NearPing
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.disspear574.nearping
