name: Earshot
options:
  bundleIdPrefix: app.earshot
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Earshot:
    type: application
    platform: macOS
    sources:
      - path: Earshot
    info:
      path: Earshot/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Earshot
        CFBundleDisplayName: Earshot
        NSLocalNetworkUsageDescription: "Earshot finds your colleagues' Macs on this network so you can call them."
        NSBonjourServices:
          - _earshot._tcp
        ITSAppUsesNonExemptEncryption: true
    dependencies:
      - framework: Frameworks/core.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.earshot.Earshot
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
