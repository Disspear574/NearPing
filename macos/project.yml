name: Earshot
options:
  bundleIdPrefix: com.disspear574
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "14"
targets:
  Earshot:
    type: application
    platform: macOS
    # Подпись живёт здесь и только здесь, вне git.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Earshot
    info:
      path: Earshot/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: NearPing
        CFBundleDisplayName: NearPing
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "NearPing finds your colleagues' Macs on this network so you can call them."
        NSBonjourServices:
          - _earshot._tcp
        ITSAppUsesNonExemptEncryption: true
    dependencies:
      - framework: Frameworks/core.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: NearPing
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.disspear574.earshot
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
